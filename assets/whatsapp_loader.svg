<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1e2328;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c1317;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25d366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#128c7e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="dotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25d366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#128c7e;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="300" fill="url(#bgGradient)"/>
  
  <!-- WhatsApp Logo Container -->
  <g transform="translate(150, 120)">
    <!-- Logo background with glow -->
    <circle cx="0" cy="0" r="35" fill="url(#logoGradient)" filter="url(#glow)">
      <animate attributeName="r" values="35;38;35" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- WhatsApp phone icon -->
    <path d="M-15,-15 Q-15,-20 -10,-20 L10,-20 Q15,-20 15,-15 L15,5 Q15,10 10,10 L5,10 L0,15 L-5,10 L-10,10 Q-15,10 -15,5 Z" 
          fill="white" opacity="0.9"/>
    
    <!-- Phone screen -->
    <rect x="-8" y="-12" width="16" height="20" rx="2" fill="#0c1317" opacity="0.3"/>
    
    <!-- Chat bubbles -->
    <circle cx="-4" cy="-6" r="1.5" fill="white" opacity="0.8"/>
    <circle cx="0" cy="-2" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="4" cy="2" r="1.5" fill="white" opacity="0.4"/>
  </g>
  
  <!-- Loading dots -->
  <g transform="translate(150, 200)">
    <circle cx="-20" cy="0" r="6" fill="url(#dotGradient)">
      <animate attributeName="cy" values="0;-10;0" dur="1.4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="0" cy="0" r="6" fill="url(#dotGradient)">
      <animate attributeName="cy" values="0;-10;0" dur="1.4s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="20" cy="0" r="6" fill="url(#dotGradient)">
      <animate attributeName="cy" values="0;-10;0" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Loading text -->
  <text x="150" y="240" text-anchor="middle" fill="#8696a0" font-family="Arial, sans-serif" font-size="14" font-weight="400">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    Loading...
  </text>
  
  <!-- Progress bar background -->
  <rect x="100" y="255" width="100" height="3" rx="1.5" fill="rgba(134, 150, 160, 0.2)"/>
  
  <!-- Progress bar fill -->
  <rect x="100" y="255" width="0" height="3" rx="1.5" fill="url(#dotGradient)">
    <animate attributeName="width" values="0;100;0" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Floating particles -->
  <g opacity="0.3">
    <circle cx="80" cy="80" r="2" fill="#25d366">
      <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="220" cy="100" r="1.5" fill="#128c7e">
      <animate attributeName="cy" values="100;70;100" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="60" cy="220" r="1" fill="#25d366">
      <animate attributeName="cy" values="220;200;220" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="240" cy="240" r="1.5" fill="#128c7e">
      <animate attributeName="cy" values="240;210;240" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>